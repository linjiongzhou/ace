experiment_dir: OOOOOO
save_checkpoint: true
checkpoint_save_epochs:
  step: 25
validate_using_ema: true
ema:
  decay: 0.999
max_epochs: 120
n_forward_steps: 2
train_loader:
  batch_size: 16
  num_data_workers: 16
  dataset:
    - data_path: /scratch4/GFDL/gfdlscr/Linjiong.Zhou/datasets/training/gfs_analysis/part1
      subset:
        start_time: '2021-01-01'
        stop_time: '2021-01-16'
    - data_path: /scratch4/GFDL/gfdlscr/Linjiong.Zhou/datasets/training/gfs_analysis/part2
      subset:
        start_time: '2021-01-18'
        stop_time: '2022-06-23'
    - data_path: /scratch4/GFDL/gfdlscr/Linjiong.Zhou/datasets/training/gfs_analysis/part3
      subset:
        start_time: '2022-06-25'
        stop_time: '2022-12-31'
validation_loader:
  batch_size: 16
  num_data_workers: 16
  dataset:
    - data_path: /scratch4/GFDL/gfdlscr/Linjiong.Zhou/datasets/training/gfs_analysis/part3
      subset:
        start_time: '2023-01-01'
        stop_time: '2023-12-31'
inference:
  n_forward_steps: 40
  forward_steps_in_memory: 40
  loader:
    start_indices:
      times:
        - '2024-01-01T00:00:00'
        - '2024-01-15T00:00:00'
        - '2024-02-01T00:00:00'
        - '2024-02-15T00:00:00'
        - '2024-03-01T00:00:00'
        - '2024-03-15T00:00:00'
        - '2024-04-01T00:00:00'
        - '2024-04-15T00:00:00'
        - '2024-05-01T00:00:00'
        - '2024-05-15T00:00:00'
        - '2024-06-01T00:00:00'
        - '2024-06-15T00:00:00'
        - '2024-07-01T00:00:00'
        - '2024-07-15T00:00:00'
        - '2024-08-01T00:00:00'
        - '2024-08-15T00:00:00'
        - '2024-09-01T00:00:00'
        - '2024-09-15T00:00:00'
        - '2024-10-01T00:00:00'
        - '2024-10-15T00:00:00'
        - '2024-11-01T00:00:00'
        - '2024-11-15T00:00:00'
        - '2024-12-01T00:00:00'
        - '2024-12-15T00:00:00'
    dataset:
      data_path: /scratch4/GFDL/gfdlscr/Linjiong.Zhou/datasets/training/gfs_analysis/part3
    num_data_workers: 16
  aggregator:
    log_histograms: true
    time_mean_reference_data: /scratch4/GFDL/gfdlscr/Linjiong.Zhou/datasets/statsdata/gfs_analysis/time_means_all.XXXXXXxYYYYYY.nc
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: AI-SHiELD
  entity: linjiong-princeton-university
optimization:
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: FusedAdam
  kwargs:
    weight_decay: 0.01
stepper:
  builder:
    type: SphericalFourierNeuralOperatorNet
    config:
      embed_dim: 256
      filter_type: linear
      hard_thresholding_fraction: 1.0
      use_mlp: true
      normalization_layer: instance_norm
      num_layers: 8
      operator_type: dhconv
      scale_factor: 1
      separable: false
      spectral_layers: 3
      spectral_transform: sht
      pos_embed: true
  loss:
    type: MSE
    weights:
      air_temperature_0: 0.5
      air_temperature_1: 0.5
      eastward_wind_0: 0.5
      northward_wind_0: 0.5
      specific_total_water_0: 0.5
      specific_total_water_1: 0.25
      specific_total_water_2: 0.5
      h500: 10
      TMP850: 5
      Q2m: 0.5
  normalization:
    global_means_path: /scratch4/GFDL/gfdlscr/Linjiong.Zhou/datasets/statsdata/gfs_analysis/centering_all.XXXXXXxYYYYYY.nc
    global_stds_path: /scratch4/GFDL/gfdlscr/Linjiong.Zhou/datasets/statsdata/gfs_analysis/scaling_full_field_all.XXXXXXxYYYYYY.nc
  residual_normalization:
    global_means_path: /scratch4/GFDL/gfdlscr/Linjiong.Zhou/datasets/statsdata/gfs_analysis/centering_all.XXXXXXxYYYYYY.nc
    global_stds_path: /scratch4/GFDL/gfdlscr/Linjiong.Zhou/datasets/statsdata/gfs_analysis/scaling_residual_all.XXXXXXxYYYYYY.nc
  ocean:
    surface_temperature_name: surface_temperature
    ocean_fraction_name: ocean_fraction
  corrector:
    conserve_dry_air: true
    force_positive_names:
    - specific_total_water_0
    - specific_total_water_1
    - specific_total_water_2
    - specific_total_water_3
    - specific_total_water_4
    - specific_total_water_5
    - specific_total_water_6
    - specific_total_water_7
    - Q2m
  next_step_forcing_names:
  - DSWRFtoa
  in_names:
  - land_fraction
  - ocean_fraction
  - sea_ice_fraction
  - DSWRFtoa
  - HGTsfc
  - global_mean_co2
  - PRESsfc
  - surface_temperature
  - TMP2m
